[package]
name = "rustconf-integration-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Integration tests for rustconf against live RESTCONF emulators"
publish = false

[dependencies]
# Workspace dependencies
rustconf = { path = "../../rustconf" }
rustconf-runtime = { path = "../../rustconf-runtime", features = ["reqwest"] }

# Async runtime
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "time"] }

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Container management
testcontainers = "0.23"

# XML generation (JUnit reports)
quick-xml = { version = "0.36", features = ["serialize"] }

# Error handling
thiserror.workspace = true

# Property-based testing
proptest.workspace = true

# Base64 encoding for Basic auth
base64 = "0.21"

# Async trait for generated server code
async-trait = "0.1"

# Logging
log = "0.4"

# Temporary files for tests
tempfile.workspace = true

[build-dependencies]
# Code generation at build time
rustconf = { path = "../../rustconf" }
