# Reference configuration for sysrepo/Netopeer2 emulator.
#
# Netopeer2 is a NETCONF/RESTCONF server that ships with IETF standard YANG
# models (ietf-interfaces, ietf-system, etc.). It serves as a lightweight
# conformance target for RESTCONF protocol validation without requiring a
# vendor-specific emulator.
#
# These values match the defaults in NetopeerConfig. Override individual
# fields here or via environment variables (env vars take precedence).
#
# Environment variable mapping:
#   RUSTCONF_EMULATOR_TYPE      -> emulator.type
#   RUSTCONF_CONTAINER_IMAGE    -> emulator.image
#   RUSTCONF_RESTCONF_PORT      -> emulator.restconf_port
#   RUSTCONF_USERNAME           -> emulator.username
#   RUSTCONF_PASSWORD           -> emulator.password
#   RUSTCONF_SKIP_TLS_VERIFY    -> emulator.skip_tls_verify
#   RUSTCONF_BASE_URL           -> emulator.base_url
#   RUSTCONF_HEALTH_TIMEOUT_SECS -> timeouts.health_check_secs
#   RUSTCONF_TEST_TIMEOUT_SECS  -> timeouts.test_timeout_secs

[emulator]
type = "netopeer2"
image = "sysrepo/netopeer2:latest"
restconf_port = 6443
username = "admin"
password = "admin"
base_path = "/restconf"
uses_tls = true
skip_tls_verify = true
health_check_path = "/restconf"
yang_model_dir = "yang/ietf"

[timeouts]
health_check_secs = 120
test_timeout_secs = 30
